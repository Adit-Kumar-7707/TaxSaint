services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxsaint-backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      - AUTH_SECRET_KEY=taxsaint-production-secure-token-sign-key-2026
    volumes:
      - ./taxsaint.db:/app/taxsaint.db

  frontend:
    image: node:20-alpine
    container_name: taxsaint-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
